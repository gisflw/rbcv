    workload: Tempo parcial
    projects:
    - id: national-water-model
      title: Desenvolvimento do Modelo Nacional da Água
      date: mar 2026 – atual
      description: >-
        Desenvolvimento e avaliação de um modelo hidrológico MGB em escala nacional para o Brasil, com
        observações hidrológicas e dados ambientais e geoespaciais. O trabalho abrange a parametrização, a
        avaliação de desempenho e fluxos reprodutíveis de processamento, além da representação de reservatórios e
        usos da água. Esses componentes preparam o modelo para análises de mudança no uso da terra, variabilidade
        climática e previsão hidrológica.
      partner: ANA
      partnerUrl: https://www.gov.br/ana/pt-br
    - id: rs-flood-alert
      title: Sistema de Alerta de Cheias do Rio Grande do Sul
      date: jul 2025 – atual
      description: >-
        Validação e integração de séries temporais hidrológicas e dados geoespaciais para o monitoramento de
        cheias no Rio Grande do Sul. O trabalho inclui modelagem de níveis e vazões para previsões em escala de
        bacia, visualizações operacionais para atividades de alerta e ferramentas de controle de qualidade dos
        dados. A exploração de curvas-chave apoia a preparação e a interpretação de observações de vazão.
      partner: SGB
      partnerUrl: https://www.sgb.gov.br/
  - title: Consultor de hidrologia e dados
    institution: Independente
    date: jan 2025 – atual
    location: Brasil
    workload: Tempo parcial
    projects:
    - id: cerrado-conservation
      title: Mapeamento de Prioridades de Conservação
      date: jan – set 2025
      description: >-
        Desenvolvimento e calibração de modelos PLANS para comparar cenários de proteção e restauração da
        vegetação no Cerrado, incluindo alterações na infiltração, evapotranspiração e escoamento superficial. A
        análise integra dados de sensoriamento remoto, séries climáticas históricas e mapas de uso da terra em
        fluxos com Python e QGIS para avaliar a adicionalidade hídrica em escala regional. Os resultados incluem
        indicadores de conservação, mapas de prioridade, visualizações geoespaciais e relatórios técnicos.
      client: Instituto Cerrados
      clientUrl: https://cerrados.org/
    - id: water-availability-database
      title: Base de Dados de Disponibilidade Hídrica
      date: mai – nov 2025
      description: >-
        Diagnóstico de uma base existente da ANA, incluindo tabelas, relações e rotinas espaciais, seguido do
        projeto de um novo modelo lógico e físico em PostgreSQL/PostGIS. Funções de processamento e rotinas de
        migração transferiram os registros para uma estrutura unificada de dados de disponibilidade hídrica. Um
        manual e materiais técnicos de treinamento documentaram procedimentos de consulta, atualização e ingestão
        de dados.
      client: ANA
      clientUrl: https://www.gov.br/ana/pt-br
  - title: Cientista de dados geoespaciais
    institution: UK Centre for Ecology & Hydrology (UKCEH)
    date: jul 2022 – mai 2025
    location: Reino Unido
    institutionUrl: https://www.ceh.ac.uk/
    workload: Tempo integral
    projects:
    - id: nrfa
      title: National River Flow Archive (NRFA)
      date: jul 2022 – mai 2025
      description: >-
        Processamento, manutenção e análise espacial de dados de bacias e ambientais de rios monitorados no Reino
        Unido. O trabalho produziu descritores de bacias e mapas que sintetizam suas características para
        produtos de dados hidrológicos e pesquisas em recursos hídricos. Atualizações contínuas exigiram
        verificações de consistência das informações das bacias.
    - id: fdri
      title: Floods and Droughts Research Infrastructure (FDRI)
      date: jun 2023 – mai 2025
      description: >-
        Desenvolvimento de ferramentas para processar dados LiDAR de alta resolução e preparar modelos de terreno
        para fluxos de pesquisa. Esse trabalho contribuiu para modelos digitais de terreno e de superfície
        integrados para a Inglaterra e o País de Gales, disponibilizando informações detalhadas de elevação para
        análises espaciais. Notebooks Jupyter complementares demonstram o uso do conjunto de dados integrado em
        outras aplicações de pesquisa.
    - id: mambo
      title: Modern approaches to biodiversity monitoring (MAMBO)
      date: dez 2022 – out 2024
      description: >-
        Desenvolvimento de um fluxo com attention U-Net para segmentar imagens RGB obtidas por drones. O
        processamento das imagens e a aplicação do modelo identificam arbustos individuais e agrupamentos,
        convertendo observações visuais em feições de vegetação mapeadas. As delimitações resultantes apoiam
        análises da cobertura de arbustos e dos padrões espaciais da vegetação em pesquisas de monitoramento da
        biodiversidade.
    - id: eidc
      title: Environmental Information Data Centre (EIDC)
      date: jul 2022 – dez 2024
      description: >-
        Curadoria e preparação de conjuntos de dados de pesquisa para ingestão e publicação nos fluxos do centro.
        O trabalho aplicou práticas consistentes de gestão de dados desde o recebimento dos conjuntos até a
        preparação para publicação, ajudando a disponibilizar dados ambientais em formato adequado para
        reutilização por outros pesquisadores.
  - title: Pesquisador
    institution: Universidade Federal do Rio Grande do Sul (UFRGS)
    date: mar 2018 – mai 2022
    location: Brasil
    institutionUrl: https://www.ufrgs.br/
    projects:
    - id: mgb-bho
      title: MGB–BHO
      date: mar 2020 – mai 2022
      description: >-
        Integração de um modelo hidrológico de grandes bacias à Base Hidrográfica Ottocodificada brasileira para
        que as unidades do modelo acompanhassem uma rede fluvial vetorial nacional. Isso exigiu métodos para
        discretizar a rede no pré-processamento e obter parâmetros hidrológicos dos dados hidrográficos. Os
        procedimentos resultantes apoiaram o uso consistente da base fluvial nacional em fluxos de modelagem.
      partner: ANA
      partnerUrl: https://www.gov.br/ana/pt-br
    - id: water-accounting
      title: Contabilidade da Água
      date: mar 2020 – mai 2022
      description: >-
        Análise em escala nacional de precipitação, umidade do solo, evapotranspiração e armazenamento de água
        nas regiões hidrográficas do Brasil. A quantificação da variabilidade espacial e temporal forneceu
        insumos hidrológicos ao Sistema de Contas Econômicas Ambientais para Água (SEEA-Water), conectando dados
        ambientais às informações usadas para descrever estoques e fluxos de água.
      partner: ANA
      partnerUrl: https://www.gov.br/ana/pt-br
    - id: reference-streamflow
      title: Regionalização de Vazões de Referência
      date: nov 2021 – mai 2022
      description: >-
        Desenvolvimento de métodos de aprendizado de máquina para estimar vazões médias de longo período e vazões
        mínimas Q95 a partir de variáveis ambientais em locais sem estações fluviométricas. As estimativas foram
        comparadas com outras abordagens de cálculo de vazões de referência, ampliando a análise para além dos
        rios monitorados e avaliando a representação das condições de vazão por dados ambientais.
      partner: ANA
      partnerUrl: https://www.gov.br/ana/pt-br
    - id: masters-riparian
      title: Avaliação hidrológica da vegetação ripária
      date: mar 2018 – fev 2020
      description: >-
        Avaliação de zonas ripárias no Cerrado brasileiro por meio de análise do terreno, sensoriamento remoto,
        índices de vegetação e dados de evapotranspiração em uma região de expansão agrícola. Uma parte central
        da pesquisa envolveu extrair e mapear redes de drenagem a partir de modelos digitais de elevação para
        identificar corredores fluviais. A análise de posição topográfica, incluindo a abordagem posteriormente
        publicada como TPS, apoiou a avaliação da vegetação ripária em larga escala.
      funder: CAPES
