    mainActivities:
    - Desenvolver fluxos de processamento de LiDAR de alta resolução para gerar insumos de modelos do terreno.
    - Integrar os dados de origem em modelos digitais consistentes do terreno e da superfície para a Inglaterra
      e o País de Gales.
    - Preparar exemplos de análise dos dados de elevação integrados em fluxos de pesquisa.
    mainOutcomes:
    - Modelos integrados de terreno e superfície derivados de LiDAR para a Inglaterra e o País de Gales.
    - Dados de elevação consistentes para pesquisas sobre cheias e secas nos dois países.
  - id: mambo
    role: spatial-data-scientist
    title: Monitoramento Moderno da Biodiversidade (MAMBO)
    startDate: '2022-12'
    endDate: '2024-10'
    scope: Desenvolvimento de métodos de sensoriamento remoto para monitoramento de habitats no MAMBO, com foco
      em mapeamento e estimativa da altura de arbustos a partir de imagens de drone e medidas LiDAR como referência
      de altura.
    mainActivities:
    - Desenvolver um fluxo Attention U-Net para treinar modelos de segmentação de arbustos e aplicar inferência
      em mosaicos de imagens RGB de drone.
    - Converter previsões de segmentação em contornos de arbustos mapeados para análise espacial.
    - Desenvolver um fluxo de estimativa de altura com normalização de modelos de superfície por fotogrametria
      com dados do terreno, extração de alturas LiDAR de referência e cálculo de métricas para polígonos de arbustos.
    - Avaliar modelos de aprendizado de máquina para estimar a altura dos arbustos a partir das métricas, com
      validação cruzada.
    mainOutcomes:
    - Contornos de arbustos mapeados a partir de imagens de drone para avaliação de habitats.
    - Estimativas de altura de arbustos baseadas em dados fotogramétricos e medidas LiDAR de referência
      para pesquisas posteriores sobre biomassa.
