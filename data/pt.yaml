    partnerUrl: https://www.gov.br/ana/pt-br
  - id: reference-streamflow
    role: researcher
    title: Regionalização de Vazões de Referência
    startDate: '2021-11'
    endDate: '2022-05'
    scope: Estimativa de vazões médias de longo período e vazões baixas Q95 em locais sem estações fluviométricas
