    mainActivities:
    - Desenvolver métodos de discretização da rede BHO durante o pré-processamento do MGB.
    - Derivar parâmetros hidrológicos dos dados hidrográficos nacionais.
    - Desenvolver procedimentos para traduzir de forma consistente a rede vetorial em unidades e entradas do
      modelo.
    - Avaliar os efeitos de escolhas de discretização em fluxos de modelagem hidrológica nacional.
    mainOutcomes:
    - Procedimentos de pré-processamento e derivação de parâmetros que permitem usar a rede BHO de modo
      consistente em aplicações do MGB.
    - Unidades e entradas do modelo alinhadas à rede fluvial vetorial oficial para aplicações em escala
      nacional.
