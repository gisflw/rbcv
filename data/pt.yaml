    - Documentação e materiais de treinamento para consulta, atualização e ingestão de dados.
    client: Agência Nacional de Águas e Saneamento Básico (ANA)
    clientUrl: https://www.gov.br/ana/pt-br
  - id: nrfa
    role: spatial-data-scientist
    title: National River Flow Archive (NRFA)
    startDate: '2022-07'
    endDate: '2025-05'
    scope: Modernização da infraestrutura de dados espaciais do arquivo oficial de vazões do Reino Unido, incluindo
      dados hidrológicos, metadados e informações de bacias de mais de 1.600 estações; substituição de processos
      manuais e arquivos geográficos dispersos por um sistema centralizado.
    mainActivities:
    - Modelar e implementar uma base espacial PostgreSQL/PostGIS, consolidando e padronizando dados de shapefiles,
      rasters, planilhas e outros arquivos.
    - Desenvolver rotinas Python para processamento espacial, ingestão de dados e cálculo de atributos ambientais
      de bacias.
    - Pré-calcular atributos ao longo da rede de drenagem do Reino Unido para reduzir processamento repetido
      a cada consulta.
    - Manter a base e apoiar produtos de dados de bacias, incluindo CAMELS-GB.
    mainOutcomes:
    - Base espacial centralizada com mais de 3 milhões de pontos da rede de drenagem, cada um associado a mais
      de 100 atributos espaciais e ambientais, em uma arquitetura menor que 3 GB.
    - Consultas SQL concluídas em minutos em vez de procedimentos manuais que podiam levar dias, com acesso mais
      fácil entre equipes e atualizações mais eficientes e reprodutíveis.
