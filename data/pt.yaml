  - id: mgb-bho
    role: researcher
    title: Integração da Rede Hidrográfica Oficial Brasileira ao Modelo MGB
    startDate: '2020-03'
    endDate: '2022-05'
    scope: Integração do modelo hidrológico de grandes bacias MGB à Base Hidrográfica Ottocodificada (BHO), alinhando
