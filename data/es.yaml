    mainOutcomes:
    - Base espacial centralizada con más de 3 millones de puntos de la red de drenaje, cada uno asociado con
      más de 100 atributos espaciales y ambientales, en una arquitectura de menos de 3 GB.
    - Consultas SQL realizadas en minutos en lugar de procedimientos manuales que podían tardar días, con acceso
      más sencillo entre equipos y actualizaciones más eficientes y reproducibles.
