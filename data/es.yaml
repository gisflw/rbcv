    workload: Tiempo parcial
    projects:
    - id: national-water-model
      title: Desarrollo del Modelo Nacional del Agua
      date: mar 2026 – actualidad
      description: >-
        Desarrollo y evaluación de un modelo hidrológico MGB a escala nacional para Brasil, con observaciones
        hidrológicas y datos ambientales y geoespaciales. El trabajo abarca la parametrización, la evaluación del
        desempeño y flujos reproducibles de procesamiento, además de la representación de embalses y usos del
        agua. Estos componentes preparan el modelo para análisis de cambios en el uso del suelo, variabilidad
        climática y pronóstico hidrológico.
      partner: ANA
      partnerUrl: https://www.gov.br/ana/pt-br
    - id: rs-flood-alert
      title: Sistema de Alerta de Inundaciones de Rio Grande do Sul
      date: jul 2025 – actualidad
      description: >-
        Validación e integración de series hidrológicas y datos geoespaciales para monitorear inundaciones en Rio
        Grande do Sul. El trabajo incluye modelización de niveles y caudales para pronósticos a escala de cuenca,
        visualizaciones operativas para actividades de alerta y herramientas de control de calidad de los datos.
        La exploración de curvas de gasto apoya la preparación e interpretación de observaciones de caudal.
      partner: SGB
      partnerUrl: https://www.sgb.gov.br/
  - title: Consultor de hidrología y datos
    institution: Independiente
    date: ene 2025 – actualidad
    location: Brasil
    workload: Tiempo parcial
    projects:
    - id: cerrado-conservation
      title: Mapeo de Prioridades de Conservación
      date: ene – sep 2025
      description: >-
        Desarrollo y calibración de modelos PLANS para comparar escenarios de protección y restauración de la
        vegetación en el Cerrado, incluidos los cambios en infiltración, evapotranspiración y escorrentía
        superficial. El análisis integra datos de teledetección, series climáticas históricas y mapas de uso del
        suelo en flujos con Python y QGIS para evaluar la adicionalidad hídrica a escala regional. Los resultados
        incluyen indicadores de conservación, mapas prioritarios, visualizaciones geoespaciales e informes
        técnicos.
      client: Instituto Cerrados
      clientUrl: https://cerrados.org/
    - id: water-availability-database
      title: Base de Datos de Disponibilidad Hídrica
      date: may – nov 2025
      description: >-
        Diagnóstico de una base existente de ANA, incluidas tablas, relaciones y rutinas espaciales, seguido del
        diseño de un nuevo modelo lógico y físico en PostgreSQL/PostGIS. Las funciones de procesamiento y las
        rutinas de migración trasladaron los registros a una estructura unificada de datos de disponibilidad
        hídrica. Un manual y materiales técnicos de capacitación documentaron procedimientos de consulta,
        actualización e ingestión de datos.
      client: ANA
      clientUrl: https://www.gov.br/ana/pt-br
  - title: Científico de datos geoespaciales
    institution: UK Centre for Ecology & Hydrology (UKCEH)
    date: jul 2022 – may 2025
    location: Reino Unido
    institutionUrl: https://www.ceh.ac.uk/
    workload: Tiempo completo
    projects:
    - id: nrfa
      title: National River Flow Archive (NRFA)
      date: jul 2022 – may 2025
      description: >-
        Procesamiento, mantenimiento y análisis espacial de datos ambientales y de cuencas fluviales monitoreadas
        en el Reino Unido. El trabajo produjo descriptores de cuencas y mapas que resumen sus características
        para productos de datos hidrológicos e investigaciones sobre recursos hídricos. Las actualizaciones
        continuas requirieron verificaciones de coherencia de la información de las cuencas.
    - id: fdri
      title: Floods and Droughts Research Infrastructure (FDRI)
      date: jun 2023 – may 2025
      description: >-
        Desarrollo de herramientas para procesar datos LiDAR de alta resolución y preparar modelos del terreno
        para flujos de investigación. Este trabajo contribuyó a modelos digitales integrados del terreno y de la
        superficie para Inglaterra y Gales, con información detallada de elevación disponible para análisis
        espaciales. Cuadernos Jupyter complementarios muestran cómo utilizar el conjunto de datos integrado en
        otras aplicaciones de investigación.
    - id: mambo
      title: Modern approaches to biodiversity monitoring (MAMBO)
      date: dic 2022 – oct 2024
      description: >-
        Desarrollo de un flujo con attention U-Net para segmentar imágenes RGB obtenidas por drones. El
        procesamiento de imágenes y la aplicación del modelo identifican arbustos individuales y agrupaciones,
        convirtiendo observaciones visuales en elementos de vegetación cartografiados. Las delimitaciones
        resultantes apoyan el análisis de la cobertura de arbustos y los patrones espaciales de la vegetación en
        investigaciones de monitoreo de la biodiversidad.
    - id: eidc
      title: Environmental Information Data Centre (EIDC)
      date: jul 2022 – dic 2024
      description: >-
        Curaduría y preparación de conjuntos de datos de investigación para su ingestión y publicación mediante
        los flujos del centro. El trabajo aplicó prácticas consistentes de gestión de datos desde la recepción de
        los conjuntos hasta su preparación para la publicación, facilitando la disponibilidad de datos
        ambientales en un formato reutilizable por otros investigadores.
  - title: Investigador
    institution: Universidade Federal do Rio Grande do Sul (UFRGS)
    date: mar 2018 – may 2022
    location: Brasil
    institutionUrl: https://www.ufrgs.br/
    projects:
    - id: mgb-bho
      title: MGB–BHO
      date: mar 2020 – may 2022
      description: >-
        Integración de un modelo hidrológico de grandes cuencas con la Base Hidrográfica Ottocodificada brasileña
        para que las unidades del modelo siguieran una red fluvial vectorial nacional. Esto requirió métodos para
        discretizar la red durante el preprocesamiento y obtener parámetros hidrológicos de los datos
        hidrográficos. Los procedimientos resultantes apoyaron el uso coherente de la base fluvial nacional en
        los flujos de modelización.
      partner: ANA
      partnerUrl: https://www.gov.br/ana/pt-br
    - id: water-accounting
      title: Contabilidad del Agua
      date: mar 2020 – may 2022
      description: >-
        Análisis a escala nacional de precipitación, humedad del suelo, evapotranspiración y almacenamiento de
        agua en las regiones hidrográficas de Brasil. La cuantificación de la variabilidad espacial y temporal
        aportó insumos hidrológicos al Sistema de Contabilidad Ambiental y Económica para el Agua (SEEA-Water),
        relacionando los datos ambientales con la información utilizada para describir reservas y flujos de agua.
      partner: ANA
      partnerUrl: https://www.gov.br/ana/pt-br
    - id: reference-streamflow
      title: Regionalización de Caudales de Referencia
      date: nov 2021 – may 2022
      description: >-
        Desarrollo de métodos de aprendizaje automático para estimar caudales medios de largo plazo y caudales
        bajos Q95 a partir de variables ambientales en lugares sin estaciones de aforo. Las estimaciones se
        compararon con otros métodos de cálculo de caudales de referencia, ampliando el análisis más allá de los
        ríos monitoreados y evaluando la representación de las condiciones de caudal mediante datos ambientales.
      partner: ANA
      partnerUrl: https://www.gov.br/ana/pt-br
    - id: masters-riparian
      title: Evaluación hidrológica de la vegetación ribereña
      date: mar 2018 – feb 2020
      description: >-
        Evaluación de zonas ribereñas del Cerrado brasileño mediante análisis del terreno, teledetección, índices
        de vegetación y datos de evapotranspiración en una región de expansión agrícola. Una parte central de la
        investigación consistió en extraer y cartografiar redes de drenaje a partir de modelos digitales de
        elevación para identificar corredores fluviales. El análisis de posición topográfica, incluido el método
        publicado posteriormente como TPS, apoyó la evaluación de la vegetación ribereña a gran escala.
      funder: CAPES
