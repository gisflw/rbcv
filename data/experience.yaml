- id: spatial-data-scientist
  title: Spatial Data Scientist
  institution: UK Centre for Ecology & Hydrology (UKCEH)
  date: Jul 2022 – May 2025
  location: United Kingdom
  institutionUrl: https://www.ceh.ac.uk/
  overview:
  - Development and maintenance of the National River Flow Archive's PostgreSQL/PostGIS spatial database
    and catchment attributes; support for hydrological data products such as CAMELS-GB v2.
  - High-resolution LiDAR workflows and integrated terrain and surface models for England and Wales.
