- id: researcher
  title: Researcher
  institution: Federal University of Rio Grande do Sul (UFRGS)
  date: Mar 2018 – May 2022
  location: Brazil
  institutionUrl: https://www.ufrgs.br/
  overview:
  - Integration of the MGB hydrological model with Brazil's Ottocodified Hydrographic Base (BHO); river-network
    preprocessing and parameter-derivation methods for national-scale modeling.
  - Analysis of precipitation, evapotranspiration, soil moisture, and water storage across Brazil for
