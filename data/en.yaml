  - id: cerrado-conservation
    role: hydrology-data-consultant
    title: Priority Conservation Mapping
    startDate: '2025-01'
    endDate: '2025-09'
    scope: Identification of priority areas for native-vegetation conservation and restoration for water availability
      in the Cerrado region (Brazilian Savannah).
    mainActivities:
    - Contribution of hydrological-modeling and spatial-analysis methods, emphasizing high-resolution topographic-data
      processing.
    - Development and application of a topographic hydrological-importance indicator from digital terrain models,
      integrating HAND (Height Above Nearest Drainage) and TWI (Topographic Wetness Index) as measures of soil-saturation
      tendency, wetland and valley-bottom occurrence, and natural-infiltration potential.
    - Geospatial-data processing and integration; definition of indicator transformations and methodological
      criteria; and contribution to analysis and visualization of results.
    mainOutcomes:
    - A detailed spatial representation of topographic conditions associated with soil saturation and infiltration
      potential, distinguishing wetter valley bottoms and wetlands from slopes and plateaus with greater potential
      to receive and infiltrate rainfall.
    - A topographic indicator incorporated into the natural hydrological-importance index and the method for
      classifying priority areas for water conservation in the Cerrado.
    client: Cerrados Institute
    clientUrl: https://cerrados.org/
  - id: water-availability-database
