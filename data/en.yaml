    mainActivities:
    - Assembly of national datasets on precipitation, soil moisture, evapotranspiration, and water storage.
    - Analysis of spatial and temporal variability across Brazilian hydrographic regions.
    - Integration of hydrological evidence with information on water stocks and flows in environmental-economic
      accounts.
    mainOutcomes:
    - National hydrological estimates and analyses supporting Brazil’s environmental-economic water
