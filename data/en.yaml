    startDate: '2018-03'
    endDate: '2020-02'
    scope: Identification of riparian zones and large-scale assessment of vegetation behavior in an agricultural-expansion
      region of the Brazilian Savannah.
    mainActivities:
    - Extraction and mapping of drainage networks from digital elevation models for river-corridor identification.
    - Analysis of terrain and topographic position, with representation of spatial variation in drainage density.
    - Combination of remote sensing, vegetation indices, and evapotranspiration data for riparian-vegetation
      assessment.
    - Application of the resulting methods to large-scale analysis of riparian zones in the Cerrado.
    mainOutcomes:
    - A terrain-based method and mapped drainage information supporting large-scale identification and
      assessment of riparian vegetation.
    - A large-scale assessment of riparian-vegetation behavior using remote sensing, vegetation indices,
      and evapotranspiration data.
