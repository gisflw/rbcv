    mainActivities:
    - Development of methods for BHO river-network discretization during MGB preprocessing.
    - Derivation of hydrological parameters from national hydrographic data.
    - Development of procedures for consistent translation of the vector network into model units and inputs.
    - Evaluation of the effects of discretization choices on national-scale hydrological modeling workflows.
    mainOutcomes:
    - Preprocessing and parameter-derivation procedures enabling consistent use of the BHO river network
      in MGB applications.
    - Model units and inputs aligned with the official vector river network for national-scale
      applications.
    partner: Agência Nacional de Águas e Saneamento Básico (ANA)
    partnerUrl: https://www.gov.br/ana/pt-br
  - id: water-accounting
    role: researcher
    title: System of Environmental-Economic Accounting for Water (SEEA-Water) for Brazil
    startDate: '2020-03'
    endDate: '2022-05'
    scope: Quantification of the spatial and temporal variability of water stocks and fluxes across Brazil’s
