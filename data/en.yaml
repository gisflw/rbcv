    - More consistent data organization and management across dataset preparation and release.
  - id: mgb-bho
    role: researcher
    title: Integration of the Brazilian Official River Network to the MGB Hydrological Model
    startDate: '2020-03'
    endDate: '2022-05'
    scope: Integration of the MGB large-basin hydrological model with the Brazilian Ottocodified Hydrographic
