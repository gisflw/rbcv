  items:
  - title: Postdoctoral Researcher
    institution: Federal University of Rio Grande do Sul (UFRGS)
    date: Jul 2025 – present
    location: Brazil
    institutionUrl: https://www.ufrgs.br/
    workload: Part-time
    projects:
    - id: national-water-model
      title: National Water Model Development
      date: Mar 2026 – present
      description: >-
        Development and evaluation of a national-scale MGB hydrological model for Brazil, using hydrological
        observations, environmental datasets and geospatial information. The work includes model
        parameterization, performance checks and reproducible data-processing workflows, alongside representation
        of reservoirs and water use. These components prepare the model for analyses of land-use change, climate
        variability and hydrological forecasting.
      partner: ANA
      partnerUrl: https://www.gov.br/ana/pt-br
    - id: rs-flood-alert
      title: Flood Alert System for Rio Grande do Sul
      date: Jul 2025 – present
      description: >-
        Validation and integration of hydrological time series and geospatial datasets for flood monitoring
        across Rio Grande do Sul. The work includes water-level and streamflow modelling for basin-scale
        forecasts, operational visualizations for warning activities, and tools for flood-data quality control.
        Rating-curve exploration supports the preparation and interpretation of streamflow observations.
      partner: SGB
      partnerUrl: https://www.sgb.gov.br/
  - title: Hydrology & Data Consultant
    institution: Independent
    date: Jan 2025 – present
    location: Brazil
    workload: Part-time
    projects:
    - id: cerrado-conservation
      title: Priority Conservation Mapping
      date: Jan – Sep 2025
      description: >-
        Development and calibration of PLANS models to compare vegetation protection and restoration scenarios in
        the Cerrado, including changes in infiltration, evapotranspiration and surface runoff. The analysis
        combines remote-sensing observations, historical climate series and land-use maps through Python and QGIS
        workflows to assess hydrological additionality at regional scale. Outputs include conservation
        indicators, prioritization maps, geospatial visualizations and technical reports.
      client: Cerrados Institute
      clientUrl: https://cerrados.org/
    - id: water-availability-database
      title: Water Availability Database
      date: May – Nov 2025
      description: >-
        Diagnosis of an existing ANA database, including its tables, relationships and spatial routines, followed
        by design of a new logical and physical PostgreSQL/PostGIS model. Processing functions and migration
        routines transferred records into a unified structure for water-availability data. A user manual and
        technical training materials documented procedures for querying, updating and ingesting data.
      client: ANA
      clientUrl: https://www.gov.br/ana/pt-br
  - title: Spatial Data Scientist
    institution: UK Centre for Ecology & Hydrology (UKCEH)
    date: Jul 2022 – May 2025
    location: United Kingdom
    institutionUrl: https://www.ceh.ac.uk/
    workload: Full-time
    projects:
    - id: nrfa
      title: National River Flow Archive (NRFA)
      date: Jul 2022 – May 2025
      description: >-
        Processing, maintenance and spatial analysis of catchment and environmental datasets for monitored river
        basins in the United Kingdom. The work produced catchment descriptors and mapping outputs that summarize
        basin characteristics for hydrological data products and water resources research. Ongoing updates
        required consistency checks across the underlying catchment information.
    - id: fdri
      title: Floods and Droughts Research Infrastructure (FDRI)
      date: Jun 2023 – May 2025
      description: >-
        Development of tools to process high-resolution LiDAR data into terrain-model inputs for research
        workflows. This work contributed to merged digital terrain and surface models for England and Wales,
        making detailed elevation information available for spatial analysis. Companion Jupyter notebooks
        demonstrate how the integrated dataset can be used in downstream research applications.
    - id: mambo
      title: Modern approaches to biodiversity monitoring (MAMBO)
      date: Dec 2022 – Oct 2024
      description: >-
        Development of an attention U-Net workflow for segmenting RGB imagery collected by drones. Image
        processing and model application identify individual shrubs and shrub clumps, converting visual
        observations into mapped vegetation features. The resulting delineations support analysis of shrub cover
        and spatial vegetation patterns in biodiversity monitoring research.
    - id: eidc
      title: Environmental Information Data Centre (EIDC)
      date: Jul 2022 – Dec 2024
      description: >-
        Curation and preparation of research datasets for ingestion and publication through the centre’s data
        workflows. The work applied consistent data-management practices from dataset submission through
        preparation for release, helping make environmental data available in a form suitable for reuse by other
        researchers.
  - title: Researcher
    institution: Federal University of Rio Grande do Sul (UFRGS)
    date: Mar 2018 – May 2022
    location: Brazil
    institutionUrl: https://www.ufrgs.br/
    projects:
    - id: mgb-bho
      title: MGB–BHO
      date: Mar 2020 – May 2022
      description: >-
        Integration of a large-basin hydrological model with the Brazilian Ottocodified Hydrographic Base so
        model units could follow a national vector river network. This required methods to discretize the network
        during preprocessing and derive hydrological parameters from the hydrographic data. The resulting
        procedures supported consistent use of the national river database in modelling workflows.
      partner: ANA
      partnerUrl: https://www.gov.br/ana/pt-br
    - id: water-accounting
      title: Water Accounting
      date: Mar 2020 – May 2022
      description: >-
        National-scale analysis of precipitation, soil moisture, evapotranspiration and water storage across
        Brazil’s hydrographic regions. Quantification of spatial and temporal variability supplied hydrological
        inputs for the System of Environmental-Economic Accounting for Water (SEEA-Water), linking environmental
        datasets with information used to describe water stocks and flows.
      partner: ANA
      partnerUrl: https://www.gov.br/ana/pt-br
    - id: reference-streamflow
      title: Reference Streamflow Regionalization
      date: Nov 2021 – May 2022
      description: >-
        Development of machine-learning methods to estimate long-term mean streamflow and Q95 low flows from
        environmental predictors at ungauged locations. The resulting estimates were compared with other
        approaches for deriving reference flows, extending the analysis beyond monitored rivers and testing how
        well environmental information represents streamflow conditions across different locations.
      partner: ANA
      partnerUrl: https://www.gov.br/ana/pt-br
    - id: masters-riparian
      title: Riparian vegetation hydrological assessment
      date: Mar 2018 – Feb 2020
      description: >-
        Assessment of riparian zones in the Brazilian Cerrado through terrain analysis, remote sensing,
        vegetation indices and evapotranspiration data in a region undergoing agricultural expansion. A major
        part of the research involved extracting and mapping drainage networks from digital elevation models to
        identify river corridors. Topographic-position analysis, including the approach later published as TPS,
        supported large-scale assessment of riparian vegetation.
      funder: CAPES
