    - Characterization of spatial and temporal variation in water stocks and fluxes across Brazilian
      hydrographic regions.
    partner: Agência Nacional de Águas e Saneamento Básico (ANA)
    partnerUrl: https://www.gov.br/ana/pt-br
  - id: reference-streamflow
    role: researcher
    title: Reference Streamflow Regionalization
    startDate: '2021-11'
    endDate: '2022-05'
    scope: Estimating long-term mean streamflow and Q95 low flow at ungauged locations across Brazil using machine-learning
      models and environmental predictors.
    mainActivities:
    - Assembly of streamflow observations and environmental predictors for model development.
    - Development of machine-learning models for long-term mean streamflow and Q95 estimation.
    - Evaluation of model performance and uncertainty across different hydrological settings.
    - Comparison of machine-learning estimates with alternative reference-streamflow methods.
    - Generation of predictions for ungauged locations across the national hydrographic network.
    mainOutcomes:
    - National reference-streamflow estimates for more than 400,000 ungauged river points.
    - Performance and uncertainty assessments of machine-learning estimates across different hydrological
      settings.
    partner: Agência Nacional de Águas e Saneamento Básico (ANA)
    partnerUrl: https://www.gov.br/ana/pt-br
