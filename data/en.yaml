    startDate: '2025-05'
    endDate: '2025-11'
    scope: Redesign and migration of ANA’s geospatial database for water-availability information into a unified,
      documented PostgreSQL/PostGIS system.
    mainActivities:
    - Diagnosis of the existing database structure, including tables, relationships, and spatial routines.
    - Design of the new logical and physical PostgreSQL/PostGIS data model.
    - Development of processing functions and migration routines for legacy records.
    - Consolidation of water-availability data in a unified structure.
    - Preparation of a user manual and technical training materials for data querying, updating, and ingestion.
    mainOutcomes:
    - A unified PostgreSQL/PostGIS data model and migration workflow for water-availability information.
    - Documentation and training materials for querying, updating, and ingesting data.
    client: ANA
    clientUrl: https://www.gov.br/ana/pt-br
  - id: nrfa
    role: spatial-data-scientist
    title: National River Flow Archive (NRFA)
    startDate: '2022-07'
    endDate: '2025-05'
    scope: Modernization of the spatial-data infrastructure of the UK’s official river-flow archive, including
      hydrological data, metadata, and catchment information for more than 1,600 stations. Replacement of manual
      processes and dispersed geographic files with a centralized system for data management and querying.
    mainActivities:
    - Modeling and implementation of a PostgreSQL/PostGIS spatial database, with consolidation and standardization
      of data from shapefiles, rasters, spreadsheets, and other files.
    - Development of Python routines for spatial processing, data ingestion, and calculation of catchment environmental
      attributes.
    - Precomputation of attributes across the UK drainage network and reduced repeated processing per query.
    - Database maintenance and support for catchment data products, including CAMELS-GB.
    mainOutcomes:
    - A centralized spatial database with more than 3 million drainage-network points, each linked to more than
      100 spatial and environmental attributes, in an architecture smaller than 3 GB.
    - SQL queries completed in minutes instead of manual procedures and queries that could take days, with easier
      access across teams and more efficient, reproducible updates and addition of new stations.
  - id: fdri
    role: spatial-data-scientist
    title: Floods and Droughts Research Infrastructure (FDRI)
    startDate: '2023-06'
    endDate: '2025-05'
    scope: Transformation of high-resolution LiDAR data into integrated terrain products and reusable analysis
      resources for floods-and-droughts research in England and Wales.
    mainActivities:
    - Development of workflows for high-resolution LiDAR processing into terrain-model inputs.
    - Merging of source data into consistent digital terrain and digital surface models for England and Wales.
    - Preparation of analysis examples on integrated elevation data in research workflows.
    mainOutcomes:
    - Integrated LiDAR-based terrain and surface models for England and Wales.
    - Consistent elevation inputs for flood-and-drought research across the two countries.
  - id: mambo
    role: spatial-data-scientist
    title: Modern Approaches to the Monitoring of Biodiversity (MAMBO)
    startDate: '2022-12'
    endDate: '2024-10'
    scope: Development of remote-sensing methods for MAMBO's habitat monitoring work, focusing on shrub mapping
      and height estimation from drone imagery, with LiDAR measurements used as height references.
    mainActivities:
    - Development of an Attention U-Net workflow for shrub-segmentation model training and tiled inference across
      large drone RGB images.
    - Conversion of segmentation predictions into mapped shrub outlines for spatial analysis.
    - Development of a shrub-height workflow for normalization of structure-from-motion (SfM) surface models
      with terrain data, LiDAR reference-height extraction from point clouds at shrub polygons, and SfM-metric
      derivation for those polygons.
    - Evaluation of machine-learning models for shrub-height estimation from SfM metrics using cross-validation.
    mainOutcomes:
    - Mapped shrub outlines from drone imagery for habitat assessment.
    - Shrub-height estimates informed by structure-from-motion data and LiDAR reference measurements for
      subsequent biomass research.
  - id: eidc
